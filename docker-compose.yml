services:

  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    env_file: .env
    environment:
      PUID: $PID
      PGID: $GID
      DB_CONNECTION: sqlite
      APP_DEBUG: "true"
      SPEEDTEST_SCHEDULE: "24 */6 * * *"
    volumes:
      - ./data/speedtest:/config
    ports:
      # Host port is allocated by homelab-infra/registry.yaml (services.speedtest.upstream.port)
      - "${SPEEDTEST_HOST_PORT:-20016}:80"
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file: .env
    environment:
      PUID: $PID
      PGID: $GID
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:-home.stanley.arpa,home.stanley.arpa:443,localhost,127.0.0.1}"
      HOMEPAGE_VAR_SPEEDTEST_PORT: "${SPEEDTEST_HOST_PORT:-20016}"
      HOMEPAGE_VAR_JELLYFIN_PORT: "${JELLYFIN_HOST_PORT:-8096}"
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/homelab-ca.crt
      SSL_CERT_FILE: /etc/ssl/certs/homelab-ca.crt
    ports:
      # Host port is allocated by homelab-infra/registry.yaml (services.homepage.upstream.port)
      - "${HOMEPAGE_HOST_PORT:-20017}:3000"
    volumes:
      - ./config:/app/config
      - /etc/homelab/certs/ca/ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
    restart: unless-stopped
    dns:
      - 10.92.8.6
      - 10.92.8.1
    dns_search:
      - stanley.arpa

  # Scheduled job, not a service: regenerates config/bookmarks.yaml from the
  # registry. Run via scripts/sync-bookmarks.sh (cron, installed by up.sh).
  bookmarks-sync:
    profiles: ["jobs"]
    build:
      context: jobs/bookmarks-sync
    network_mode: none
    user: "${PID:-1000}:${GID:-1000}"
    environment:
      BOOKMARKS_EXCLUDE: "${BOOKMARKS_EXCLUDE:-}"
      DRY_RUN: "${DRY_RUN:-false}"
    volumes:
      - ${REGISTRY_PATH:-../homelab-infra/registry.yaml}:/registry.yaml:ro
      - ./config:/config
