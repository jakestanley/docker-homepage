---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/service-widgets

- greeting:
    text: ADLER

- resources:
    label: Resources
    expanded: true
    cpu: true
    memory: true

- glances:
    # sudo apt-get install glances
    # Override /lib/systemd/system/glances.service via /etc/systemd/system/glances.service.d/override.conf:
    #   [Service]
    #   ExecStart=
    #   ExecStart=/usr/bin/glances -w -B 10.92.8.6
    url: http://{{HOMEPAGE_VAR_ADDRESS}}:61208
    label: System
    cpu: false
    mem: false
    expanded: true
    target: _blank
    diskUnits: bbytes
    disk: 
      - /

- glances:
    # See System glances widget above for setup notes
    url: http://{{HOMEPAGE_VAR_ADDRESS}}:61208
    label: Home
    cpu: false
    mem: false
    expanded: true
    target: _blank
    diskUnits: bbytes
    disk: 
      - /home

- glances:
    # See System glances widget above for setup notes
    url: http://{{HOMEPAGE_VAR_ADDRESS}}:61208
    label: Media
    cpu: false
    mem: false
    expanded: true
    target: _blank
    diskUnits: bbytes
    disk: 
      - /var/media
