---
# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/services

- Row 1:
  - System Health:
    - Speedtest:
        icon: speedtest-tracker.png
        href: "https://speedtest.stanley.arpa/admin"
        widget:
          type: speedtest
          url: "https://speedtest.stanley.arpa/"
    - Tailscale:
        icon: tailscale.png
        href: "https://login.tailscale.com/admin/machines"
        widget:
          type: tailscale
          deviceid: {{HOMEPAGE_VAR_TAILSCALE_DEVICEID}}
          key: {{HOMEPAGE_VAR_TAILSCALE_KEY}}
    - Processes:
        widget:
          type: glances
          url: "http://{{HOMEPAGE_VAR_ADDRESS}}:61208"
          metric: process
          chart: true
#    - Memory:
#        widget:
#          type: glances
#          url: "http://{{HOMEPAGE_VAR_ADDRESS}}:61208"
#          metric: memory
#          chart: true
    - Info:
        widget:
          type: glances
          url: "http://{{HOMEPAGE_VAR_ADDRESS}}:61208"
          metric: info
          chart: true
    - RTX:
        href: "https://rtx.stanley.arpa"
        widget:
          type: customapi
          url: https://rtx.stanley.arpa/api
          refreshInterval: 30000
          method: GET
          mappings:
            - field: status
              label: Status
              format: text
            - field: temperature
              label: Temp
              format: text
            - field: memory_available
              label: Memory
              format: text
            - field: gpu_utilization
              label: GPU Util
              format: text
          # suppress if for example, the PC is off
          hideErrors: true

  - Services:
    - Qbittorrent:
        icon: qbittorrent.png
        href: "https://torrents.stanley.arpa"
        widget:
          type: qbittorrent
          url: "https://torrents.stanley.arpa"
          username: admin
          password: {{HOMEPAGE_VAR_QBT_PASSWORD}}
    - Plex:
        icon: plex.png
        href: "https://plex.stanley.arpa/web"
        description: Watch movies and TV shows.
        server: localhost
        widget:
          type: plex
          url: "https://plex.stanley.arpa:32400"
          key: {{HOMEPAGE_VAR_PLEX_KEY}}
          fields: ["streams", "movies", "tv"]
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.stanley.arpa/web/index.html
        description: Manage videos
        widget:
          type: jellyfin
          url: https://jellyfin.stanley.arpa/
          key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
          fields: ["movies"]
    # - Bots:
    #     widget:
    #       type: customapi
    #       url: http://{{HOMEPAGE_VAR_ADDRESS}}:5000/health
    #       refreshInterval: 30000
    #       method: GET
    #       mappings:
    #         - field: status
    #           label: Status
    #           format: text
    - Dropbox:
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_ADDRESS}}:8006/status
          refreshInterval: 30000
          method: GET
          mappings:
            - field: status
              label: Status
              format: text

  - Game Servers:
    - Arcade:
        href: "https://arcade.stanley.arpa"
        description: Every registered game server, live from the portal itself
        widget:
          type: customapi
          url: https://arcade.stanley.arpa/api/servers
          refreshInterval: 10000
          method: GET
          display: dynamic-list
          mappings:
            name: name
            label: status
            format: text
            target: "https://arcade.stanley.arpa"

  - Home:
    - Apollo:
        widget:
          type: customapi
          url: "https://metrics.stanley.arpa/query?db=climate&u=read&p={{HOMEPAGE_VAR_APOLLO_INFLUX_TOKEN}}&q=SELECT+last%28temperature%29+FROM+climate+WHERE+location%3D%27inside%27+AND+sensor%3D%27apollo1%27%3BSELECT+last%28temperature%29+FROM+climate+WHERE+location%3D%27outside%27"
          refreshInterval: 60000
          method: GET
          mappings:
            - field: results.0.series.0.values.0.1
              label: Inside
              format: float
              rounding: 1
              suffix: "°C"
            - field: results.1.series.0.values.0.1
              label: Outside
              format: float
              rounding: 1
              suffix: "°C"

- Control Panels:
  - Portainer:
      icon: portainer.png
      description: GUI for Docker containers
      href: "https://portainer.stanley.arpa"
  # - Arcade:
  #     href: "https://arcade.stanley.arpa"
  #     description: Start/stop game servers across hosts
  - UpSnap:
      icon: https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Go_gopher_favicon.svg/1280px-Go_gopher_favicon.svg.png
      href: https://upsnap.stanley.arpa
      description: Sleep and wake computers
  - Directory:
      icon: https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Nginx_logo.svg/2560px-Nginx_logo.svg.png
      href: https://directory.stanley.arpa
      description: All host and service mappings from dnsmasq/nginx
